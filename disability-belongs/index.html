<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Disability Belongs</title>

  <style>

    :root {
      --background: #222222;
      --blue: #31A9E0;
      --white: #FFFFFF;

      --main-size: clamp(38px, 5vw, 58px);
      --subject-gap: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--background);
      color: var(--white);

      font-family: "URW DIN", Arial, sans-serif;

      overflow: hidden;
    }

    .banner {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 24px 24px 16px;

      text-align: center;
    }

    /* -----------------------------
       MAIN MESSAGE
    ----------------------------- */

    .message {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      width: max-content;
      margin: 0 auto;

      gap: 10px;

      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }

    .message.fade-out {
      opacity: 0;
      transform: translateY(-8px);
    }

    .message.hidden {
      display: none;
    }

    .message.fade-in {
      animation: messageFadeIn 0.45s ease forwards;
    }

    @keyframes messageFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .line {
      position: relative;

      display: block;

      margin: 0;
      padding: 0;

      text-align: left;
    }

    .brand,
    .belong-wrap {
      font-size: var(--main-size);
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .static-word {
      color: var(--white);
    }

    /* -----------------------------
       BELONG
    ----------------------------- */

    .line-middle {
      position: relative;
    }

    .belong-wrap {
      display: inline-flex;
      align-items: baseline;

      color: var(--blue);

      white-space: nowrap;
    }

    .blue,
    .ending {
      color: var(--blue);
    }

    .ending {
      display: inline;
    }

    /* -----------------------------
       ROTATING SUBJECT
    ----------------------------- */

    .subject-wrap {
      position: absolute;

      right: calc(100% + var(--subject-gap));
      top: 0;

      width: 12ch;
      height: 1em;

      text-align: right;

      font-size: var(--main-size);
      line-height: 1;
    }

    .subject {
      position: absolute;

      top: 0;
      right: 0;

      font-size: inherit;
      line-height: inherit;
      font-weight: 600;
      letter-spacing: -0.02em;

      color: var(--white);

      white-space: nowrap;

      opacity: 0;
      transform: translateY(14px);
    }

    .subject.current {
      opacity: 1;
      transform: translateY(0);
    }

    .subject.enter {
      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }

    .subject.exit {
      opacity: 0;
      transform: translateY(-14px);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    /* -----------------------------
       FINAL TITLE
    ----------------------------- */

    .final-title {
      display: none;

      width: 100%;

      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;

      gap: 0.22em;

      padding: 0 12px;

      font-size: var(--main-size);
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.02em;

      text-align: center;

      opacity: 0;
      transform: translateY(10px);
    }

    .final-title.show {
      display: flex;

      animation:
        finalTitleIn 0.5s ease forwards;
    }

    .final-white {
      color: var(--white);
    }

    .final-blue {
      color: var(--blue);
    }

    @keyframes finalTitleIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* -----------------------------
       CONTROLS
    ----------------------------- */

    .controls {
      margin-top: 24px;
      text-align: center;
    }

    .pause-btn {
      appearance: none;

      padding: 8px 18px;

      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;

      background: transparent;
      color: var(--white);

      font-family: "URW DIN", Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .pause-btn:hover {
      border-color: var(--blue);
    }

    .pause-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    /* -----------------------------
       SCREEN READER TEXT
    ----------------------------- */

    .sr-only {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);

      white-space: nowrap;

      border: 0;
    }

    /* -----------------------------
       RESPONSIVE
    ----------------------------- */

    @media (max-width: 700px) {

      :root {
        --main-size: clamp(28px, 7vw, 40px);
        --subject-gap: 8px;
      }

      .subject-wrap {
        width: 9ch;
      }

      .banner {
        padding: 18px 12px 12px;
      }

      .controls {
        margin-top: 16px;
      }

      .final-title {
        font-size: clamp(28px, 7vw, 40px);
        padding: 0 8px;
      }
    }

    @media (max-width: 430px) {

      :root {
        --main-size: clamp(26px, 7.5vw, 34px);
        --subject-gap: 6px;
      }

      .subject-wrap {
        width: 8.5ch;
      }

      .banner {
        padding-left: 8px;
        padding-right: 8px;
      }

      .final-title {
        font-size: clamp(24px, 6.8vw, 32px);
        gap: 0.16em;
      }
    }

    /* -----------------------------
       REDUCED MOTION
    ----------------------------- */

    @media (prefers-reduced-motion: reduce) {

      .subject,
      .message,
      .final-title {
        transition: none !important;
        animation: none !important;
        transform: none !important;
      }

      .controls {
        display: none;
      }
    }

  </style>
</head>


<body>

  <main class="banner">

    <p class="sr-only">
      Be. Belong. Become. I belong. You belong. We belong.
      Disability Belongs at SDCCD.
    </p>


    <div class="message" aria-hidden="true">

      <div class="line line-top">
        <span class="brand static-word">Be.</span>
      </div>


      <div class="line line-middle">

        <span class="subject-wrap">
          <span class="subject current">I</span>
          <span class="subject next"></span>
        </span>

        <span class="belong-wrap">
          <span class="blue">Belong</span><span
            id="ending"
            class="ending"
          >.</span>
        </span>

      </div>


      <div class="line line-bottom">
        <span class="brand static-word">Become.</span>
      </div>

    </div>


    <div class="final-title" aria-hidden="true">
      <span class="final-white">Disability</span>
      <span class="final-blue">Belongs</span>
      <span class="final-white">at SDCCD.</span>
    </div>


    <div class="controls">

      <button
        class="pause-btn"
        type="button"
        aria-pressed="false"
      >
        Pause animation
      </button>

    </div>

  </main>


  <script>

    const frames = [
      {
        subject: "I",
        ending: "."
      },
      {
        subject: "You",
        ending: "."
      },
      {
        subject: "We",
        ending: "."
      }
    ];


    const currentEl =
      document.querySelector(".subject.current");

    const nextEl =
      document.querySelector(".subject.next");

    const endingEl =
      document.querySelector("#ending");

    const pauseBtn =
      document.querySelector(".pause-btn");

    const messageEl =
      document.querySelector(".message");

    const finalTitleEl =
      document.querySelector(".final-title");

    const reduceMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    let currentIndex = 0;
    let timer = null;
    let paused = false;
    let animating = false;
    let showingFinal = false;


    function renderCurrentFrame() {

      const frame = frames[currentIndex];

      currentEl.textContent =
        frame.subject;

      endingEl.textContent =
        frame.ending;
    }


    function animateTo(nextIndex) {

      if (animating) return;

      animating = true;

      const nextFrame =
        frames[nextIndex];


      nextEl.textContent =
        nextFrame.subject;

      nextEl.className =
        "subject next";


      void nextEl.offsetWidth;


      currentEl.classList.add("exit");

      nextEl.classList.add("enter");


      endingEl.textContent =
        nextFrame.ending;


      setTimeout(() => {

        currentEl.textContent =
          nextFrame.subject;

        currentEl.className =
          "subject current";


        nextEl.textContent = "";

        nextEl.className =
          "subject next";


        currentIndex =
          nextIndex;

        animating =
          false;

      }, 500);
    }


    function showFinalTitle() {

      if (animating) return;

      animating = true;
      showingFinal = true;


      messageEl.classList.add("fade-out");


      setTimeout(() => {

        messageEl.classList.add("hidden");

        finalTitleEl.classList.add("show");

        animating = false;

      }, 450);
    }


    function returnToBeginning() {

      if (animating) return;

      animating = true;


      finalTitleEl.classList.remove("show");


      setTimeout(() => {

        currentIndex = 0;

        currentEl.textContent =
          frames[0].subject;

        currentEl.className =
          "subject current";

        nextEl.textContent = "";

        nextEl.className =
          "subject next";

        endingEl.textContent =
          frames[0].ending;


        messageEl.classList.remove(
          "hidden",
          "fade-out"
        );


        void messageEl.offsetWidth;


        messageEl.classList.add("fade-in");


        setTimeout(() => {

          messageEl.classList.remove("fade-in");

          showingFinal = false;
          animating = false;

        }, 450);

      }, 450);
    }


    function scheduleNext() {

      stopLoop();


      if (
        paused ||
        reduceMotion.matches
      ) {
        return;
      }


      const delay =
        showingFinal
          ? 5000
          : 3200;


      timer = setTimeout(() => {


        if (showingFinal) {

          returnToBeginning();

          setTimeout(
            scheduleNext,
            600
          );

          return;
        }


        if (
          currentIndex <
          frames.length - 1
        ) {

          animateTo(
            currentIndex + 1
          );

          setTimeout(
            scheduleNext,
            600
          );

        } else {

          showFinalTitle();

          setTimeout(
            scheduleNext,
            600
          );
        }

      }, delay);
    }


    function stopLoop() {

      if (timer !== null) {

        clearTimeout(timer);

        timer = null;
      }
    }


    pauseBtn.addEventListener(
      "click",
      () => {

        paused = !paused;


        pauseBtn.setAttribute(
          "aria-pressed",
          String(paused)
        );


        pauseBtn.textContent =
          paused
            ? "Play animation"
            : "Pause animation";


        if (paused) {

          stopLoop();

        } else {

          scheduleNext();
        }
      }
    );


    function handleReducedMotion(event) {

      if (event.matches) {

        stopLoop();

        messageEl.classList.add("hidden");

        finalTitleEl.classList.add("show");

        pauseBtn.hidden = true;

      } else {

        finalTitleEl.classList.remove("show");

        messageEl.classList.remove(
          "hidden",
          "fade-out"
        );

        currentIndex = 0;

        renderCurrentFrame();

        showingFinal = false;

        pauseBtn.hidden = false;


        if (!paused) {

          scheduleNext();
        }
      }
    }


    if (
      typeof reduceMotion.addEventListener
      === "function"
    ) {

      reduceMotion.addEventListener(
        "change",
        handleReducedMotion
      );

    } else if (
      typeof reduceMotion.addListener
      === "function"
    ) {

      reduceMotion.addListener(
        handleReducedMotion
      );
    }


    renderCurrentFrame();


    if (reduceMotion.matches) {

      messageEl.classList.add("hidden");

      finalTitleEl.classList.add("show");

      pauseBtn.hidden = true;

    } else {

      scheduleNext();
    }

  </script>

</body>
</html>
