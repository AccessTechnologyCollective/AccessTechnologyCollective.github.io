<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Disability Belongs</title>

  <style>

    :root {
      --background: #222222;
      --blue: #31A9E0;
      --white: #FFFFFF;

      --main-size: clamp(38px, 5vw, 58px);
      --subject-gap: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--background);
      color: var(--white);

      font-family: "URW DIN", Arial, sans-serif;

      overflow: hidden;
    }


    /* =================================
       BANNER
    ================================= */

    .banner {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 24px 24px 16px;

      text-align: center;
    }


    /* =================================
       FIXED TAGLINE SPINE

             Be.
             Belong.
             Become.

    ================================= */

    .message {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      width: max-content;
      margin: 0 auto;

      gap: 10px;
    }

    .line {
      position: relative;

      display: block;

      margin: 0;
      padding: 0;

      text-align: left;
    }

    .brand,
    .belong-wrap {
      font-size: var(--main-size);
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .static-word {
      color: var(--white);
    }


    /* =================================
       BELONG
    ================================= */

    .line-middle {
      position: relative;
    }

    .belong-wrap {
      display: inline-flex;
      align-items: baseline;

      white-space: nowrap;

      color: var(--blue);
    }

    .blue {
      color: var(--blue);
    }

    .suffix {
      color: var(--blue);
    }

    /*
      Normally this is just the blue period.

      On the final frame it becomes:
      " at SDCCD."
    */

    .tail {
      color: var(--blue);

      font-size: 1em;

      transition:
        color 0.3s ease,
        font-size 0.3s ease,
        opacity 0.3s ease;
    }

    .tail.final-tail {
      color: var(--white);

      /*
        Slightly smaller so the long final
        statement remains balanced.
      */
      font-size: 0.55em;

      margin-left: 0.25em;

      letter-spacing: 0;
    }


    /* =================================
       ROTATING SUBJECT
       I / You / We / Disability
    ================================= */

    .subject-wrap {
      position: absolute;

      right: calc(100% + var(--subject-gap));
      top: 0;

      width: 12ch;
      height: 1em;

      text-align: right;

      font-size: var(--main-size);
      line-height: 1;
    }

    .subject {
      position: absolute;

      top: 0;
      right: 0;

      font-size: inherit;
      line-height: inherit;
      font-weight: 600;
      letter-spacing: -0.02em;

      color: var(--white);

      white-space: nowrap;

      opacity: 0;
      transform: translateY(14px);
    }

    .subject.current {
      opacity: 1;
      transform: translateY(0);
    }

    .subject.enter {
      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }

    .subject.exit {
      opacity: 0;
      transform: translateY(-14px);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }


    /* =================================
       CONTROLS
    ================================= */

    .controls {
      margin-top: 24px;

      text-align: center;
    }

    .pause-btn {
      appearance: none;

      padding: 8px 18px;

      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 999px;

      background: transparent;
      color: var(--white);

      font-family: "URW DIN", Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .pause-btn:hover {
      border-color: var(--blue);
    }

    .pause-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }


    /* =================================
       SCREEN READER TEXT
    ================================= */

    .sr-only {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);

      white-space: nowrap;

      border: 0;
    }


    /* =================================
       TABLET / MOBILE
    ================================= */

    @media (max-width: 700px) {

      :root {
        --main-size: clamp(28px, 7vw, 40px);
        --subject-gap: 8px;
      }

      .subject-wrap {
        width: 9ch;
      }

      .banner {
        padding: 18px 12px 12px;
      }

      .controls {
        margin-top: 16px;
      }

      .tail.final-tail {
        font-size: 0.5em;
        margin-left: 0.22em;
      }
    }


    @media (max-width: 430px) {

      :root {
        --main-size: clamp(26px, 7.5vw, 34px);
        --subject-gap: 6px;
      }

      .subject-wrap {
        width: 8.5ch;
      }

      .banner {
        padding-left: 8px;
        padding-right: 8px;
      }

      .tail.final-tail {
        font-size: 0.48em;
        margin-left: 0.2em;
      }
    }


    /* =================================
       REDUCED MOTION
    ================================= */

    @media (prefers-reduced-motion: reduce) {

      .subject,
      .tail {
        transition: none !important;
        transform: none !important;
      }

      .controls {
        display: none;
      }
    }

  </style>
</head>


<body>

  <main class="banner">


    <!--
      Static equivalent for assistive technology.
      The animated visual itself is hidden from
      screen readers so changing text is not
      repeatedly announced.
    -->

    <p class="sr-only">
      Be. Belong. Become.
      I belong.
      You belong.
      We belong.
      Disability Belongs at SDCCD.
    </p>


    <div
      class="message"
      aria-hidden="true"
    >


      <!-- BE -->

      <div class="line line-top">

        <span class="brand static-word">
          Be.
        </span>

      </div>


      <!--
        ROTATING SUBJECT + FIXED BELONG
      -->

      <div class="line line-middle">


        <span class="subject-wrap">

          <span class="subject current">
            I
          </span>

          <span class="subject next"></span>

        </span>


        <span class="belong-wrap">

          <span class="blue">
            Belong
          </span>

          <span
            id="suffix"
            class="suffix"
          ></span>

          <span
            id="tail"
            class="tail"
          >.</span>

        </span>


      </div>


      <!-- BECOME -->

      <div class="line line-bottom">

        <span class="brand static-word">
          Become.
        </span>

      </div>


    </div>


    <!-- PAUSE / PLAY -->

    <div class="controls">

      <button
        class="pause-btn"
        type="button"
        aria-pressed="false"
      >
        Pause animation
      </button>

    </div>


  </main>


  <script>

    /*
      Animation sequence:

      I Belong.
      You Belong.
      We Belong.
      Disability Belongs at SDCCD.
    */

    const frames = [

      {
        subject: "I",
        suffix: "",
        tail: ".",
        final: false
      },

      {
        subject: "You",
        suffix: "",
        tail: ".",
        final: false
      },

      {
        subject: "We",
        suffix: "",
        tail: ".",
        final: false
      },

      {
        subject: "Disability",
        suffix: "s",
        tail: "at SDCCD.",
        final: true
      }

    ];


    const currentEl =
      document.querySelector(".subject.current");

    const nextEl =
      document.querySelector(".subject.next");

    const suffixEl =
      document.querySelector("#suffix");

    const tailEl =
      document.querySelector("#tail");

    const pauseBtn =
      document.querySelector(".pause-btn");


    const reduceMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    let currentIndex = 0;

    let timer = null;

    let paused = false;

    let animating = false;


    /*
      Render suffix + ending
    */

    function renderEnding(frame) {

      suffixEl.textContent =
        frame.suffix;


      tailEl.textContent =
        frame.tail;


      if (frame.final) {

        tailEl.classList.add(
          "final-tail"
        );

      } else {

        tailEl.classList.remove(
          "final-tail"
        );
      }
    }


    /*
      Initial state
    */

    function renderCurrentFrame() {

      const frame =
        frames[currentIndex];


      currentEl.textContent =
        frame.subject;


      renderEnding(frame);
    }


    /*
      Animate to next subject
    */

    function animateTo(nextIndex) {

      if (animating) {
        return;
      }


      animating = true;


      const nextFrame =
        frames[nextIndex];


      nextEl.textContent =
        nextFrame.subject;


      nextEl.className =
        "subject next";


      /*
        Force browser to establish
        starting animation position.
      */

      void nextEl.offsetWidth;


      currentEl.classList.add(
        "exit"
      );


      nextEl.classList.add(
        "enter"
      );


      /*
        Update:

        Belong.
        or
        Belongs at SDCCD.
      */

      renderEnding(
        nextFrame
      );


      setTimeout(() => {


        currentEl.textContent =
          nextFrame.subject;


        currentEl.className =
          "subject current";


        nextEl.textContent =
          "";


        nextEl.className =
          "subject next";


        currentIndex =
          nextIndex;


        animating =
          false;


      }, 500);
    }


    /*
      Advance sequence
    */

    function advanceFrame() {

      const nextIndex =
        (currentIndex + 1)
        % frames.length;


      animateTo(
        nextIndex
      );
    }


    /*
      Begin loop

      Last frame stays visible slightly
      longer because it contains the
      training title.
    */

    function scheduleNext() {

      stopLoop();


      if (
        paused ||
        reduceMotion.matches
      ) {

        return;
      }


      const currentFrame =
        frames[currentIndex];


      const delay =
        currentFrame.final
          ? 4500
          : 3200;


      timer =
        setTimeout(
          () => {

            advanceFrame();

            /*
              Allow transition to finish
              before scheduling next frame.
            */

            setTimeout(
              scheduleNext,
              550
            );

          },
          delay
        );
    }


    /*
      Stop timer
    */

    function stopLoop() {

      if (timer !== null) {

        clearTimeout(timer);

        timer = null;
      }
    }


    /*
      Pause / play
    */

    pauseBtn.addEventListener(
      "click",
      () => {


        paused =
          !paused;


        pauseBtn.setAttribute(
          "aria-pressed",
          String(paused)
        );


        pauseBtn.textContent =
          paused
            ? "Play animation"
            : "Pause animation";


        if (paused) {

          stopLoop();

        } else {

          scheduleNext();
        }

      }
    );


    /*
      Reduced-motion preference
    */

    function handleReducedMotion(
      event
    ) {

      if (event.matches) {


        stopLoop();


        /*
          Show the complete training
          title as the static state.
        */

        currentIndex =
          frames.length - 1;


        currentEl.textContent =
          frames[currentIndex].subject;


        renderEnding(
          frames[currentIndex]
        );


        pauseBtn.hidden =
          true;


      } else {


        currentIndex = 0;


        currentEl.textContent =
          frames[0].subject;


        renderEnding(
          frames[0]
        );


        pauseBtn.hidden =
          false;


        if (!paused) {

          scheduleNext();
        }

      }
    }


    if (
      typeof reduceMotion.addEventListener
      === "function"
    ) {

      reduceMotion.addEventListener(
        "change",
        handleReducedMotion
      );

    } else if (
      typeof reduceMotion.addListener
      === "function"
    ) {

      reduceMotion.addListener(
        handleReducedMotion
      );
    }


    /*
      Start
    */

    renderCurrentFrame();


    if (
      reduceMotion.matches
    ) {


      currentIndex =
        frames.length - 1;


      currentEl.textContent =
        frames[currentIndex].subject;


      renderEnding(
        frames[currentIndex]
      );


      pauseBtn.hidden =
        true;


    } else {


      scheduleNext();

    }

  </script>

</body>
</html>
