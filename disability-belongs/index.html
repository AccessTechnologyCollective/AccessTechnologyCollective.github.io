<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Disability Belongs</title>

  <style>

    :root {
      --background: #222222;
      --blue: #31A9E0;
      --white: #FFFFFF;

      --main-size: clamp(38px, 5vw, 58px);
      --subject-gap: 18px;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }


    body {
      min-height: 100vh;

      background: var(--background);
      color: var(--white);

      font-family:
        "URW DIN",
        Arial,
        sans-serif;

      overflow: hidden;
    }


    /* =================================
       FULL BANNER
    ================================= */

    .banner {
      position: relative;

      width: 100%;
      height: 100vh;
      min-height: 220px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        24px
        24px
        58px;

      background: var(--background);
    }


    /* =================================
       ANIMATION AREA

             Be.
        I    Belong.
             Become.

       Then:

        Disability Belongs.
    ================================= */

    .message {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      width: max-content;

      margin: 0 auto;

      gap: 10px;

      /*
        Keep the existing overall
        composition position.
      */
      transform: translateX(32px);
    }


    /* =================================
       OFFICIAL WHITE LOGO STACK
    ================================= */

    .logo-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;

      gap: 10px;

      opacity: 1;

      transition:
        opacity 0.55s ease;
    }


    .logo-stack.logo-hidden {
      opacity: 0;
    }


    .line {
      position: relative;

      display: block;

      margin: 0;
      padding: 0;

      text-align: left;
    }


    .brand,
    .belong-wrap {
      font-size: var(--main-size);
      line-height: 1;

      font-weight: 600;

      letter-spacing: -0.02em;
    }


    .static-word,
    .belong-wrap,
    .belong-word {
      color: var(--white);
    }


    /* =================================
       MIDDLE LOGO LINE
    ================================= */

    .line-middle {
      position: relative;
    }


    .belong-wrap {
      display: inline-flex;
      align-items: baseline;

      white-space: nowrap;
    }


    /* =================================
       ROTATING AZURE SUBJECT

       I
       You
       We
    ================================= */

    .subject-wrap {
      position: absolute;

      right: calc(100% + var(--subject-gap));
      top: 0;

      width: 12ch;
      height: 1em;

      text-align: right;

      font-size: var(--main-size);
      line-height: 1;
    }


    .subject {
      position: absolute;

      top: 0;
      right: 0;

      font-size: inherit;
      line-height: inherit;

      font-weight: 600;

      letter-spacing: -0.02em;

      color: var(--blue);

      white-space: nowrap;

      opacity: 0;

      transform: translateY(14px);
    }


    .subject.current {
      opacity: 1;

      transform: translateY(0);
    }


    .subject.enter {
      opacity: 1;

      transform: translateY(0);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }


    .subject.exit {
      opacity: 0;

      transform: translateY(-14px);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }


    /* =================================
       FINAL MESSAGE

       Separate from the logo.

       Disability Belongs.
    ================================= */

    .final-message {
      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      margin: 0;

      color: var(--blue);

      font-size: var(--main-size);
      line-height: 1;

      font-weight: 600;

      letter-spacing: -0.02em;

      white-space: nowrap;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.65s ease;
    }


    .final-message.visible {
      opacity: 1;
    }


    /* =================================
       PAUSE / PLAY
       Bottom-left
    ================================= */

    .controls {
      position: absolute;

      left: 18px;
      bottom: 14px;

      z-index: 3;
    }


    .pause-btn {
      appearance: none;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 36px;

      padding: 7px 15px;

      border:
        1px solid
        rgba(255, 255, 255, 0.55);

      border-radius: 999px;

      background: transparent;
      color: var(--white);

      font-family:
        "URW DIN",
        Arial,
        sans-serif;

      font-size: 13px;
      font-weight: 600;

      line-height: 1;

      cursor: pointer;
    }


    .pause-btn:hover {
      border-color: var(--blue);
    }


    .pause-btn:focus-visible {
      outline:
        3px solid
        var(--blue);

      outline-offset: 3px;
    }


    /* =================================
       SDCCD LOGO
       Bottom-right
    ================================= */

    .district-logo {
      position: absolute;

      right: 18px;
      bottom: 14px;

      z-index: 2;
    }


    .district-logo img {
      display: block;

      width: 120px;
      max-width: 32vw;

      height: auto;
    }


    /* =================================
       SCREEN-READER-ONLY CONTENT
    ================================= */

    .sr-only {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);

      white-space: nowrap;

      border: 0;
    }


    /* =================================
       TABLET / SMALLER WINDOWS
    ================================= */

    @media (max-width: 700px) {

      :root {
        --main-size:
          clamp(28px, 7vw, 40px);

        --subject-gap: 8px;
      }


      .message {
        transform: translateX(20px);
      }


      .banner {
        padding:
          16px
          12px
          54px;
      }


      .subject-wrap {
        width: 9ch;
      }


      .controls {
        left: 10px;
        bottom: 9px;
      }


      .pause-btn {
        min-height: 32px;

        padding: 6px 11px;

        font-size: 11px;
      }


      .district-logo {
        right: 10px;
        bottom: 9px;
      }


      .district-logo img {
        width: 90px;
        max-width: 31vw;
      }
    }


    /* =================================
       PHONE
    ================================= */

    @media (max-width: 430px) {

      :root {
        --main-size:
          clamp(26px, 7.5vw, 34px);

        --subject-gap: 6px;
      }


      .banner {
        padding:
          14px
          8px
          49px;
      }


      .message {
        transform: translateX(12px);
      }


      .subject-wrap {
        width: 8.5ch;
      }


      .controls {
        left: 8px;
        bottom: 8px;
      }


      .pause-btn {
        min-height: 30px;

        padding: 5px 9px;

        font-size: 10px;
      }


      .district-logo {
        right: 8px;
        bottom: 8px;
      }


      .district-logo img {
        width: 75px;
        max-width: 29vw;
      }
    }


    /* =================================
       REDUCED MOTION

       Show only:
       Disability Belongs.
    ================================= */

    @media (prefers-reduced-motion: reduce) {

      .logo-stack {
        opacity: 0 !important;
        transition: none !important;
      }


      .subject {
        transition: none !important;
        transform: none !important;
      }


      .final-message {
        opacity: 1 !important;
        transition: none !important;
      }


      .controls {
        display: none;
      }
    }

  </style>
</head>


<body>

  <main
    class="banner"
    aria-label="Disability Belongs"
  >


    <!--
      Accessible static equivalent.

      The visual animation is hidden from
      assistive technology so the changing
      words are not repeatedly announced.
    -->

    <p class="sr-only">
      Be. Belong. Become.
      I belong.
      You belong.
      We belong.
      Disability belongs.
    </p>


    <!-- =================================
         ANIMATED MESSAGE
    ================================= -->

    <div
      class="message"
      aria-hidden="true"
    >


      <!-- =================================
           OFFICIAL WHITE LOGO
      ================================= -->

      <div
        id="logoStack"
        class="logo-stack"
      >


        <!-- BE -->

        <div class="line line-top">

          <span class="brand static-word">
            Be.
          </span>

        </div>


        <!-- SUBJECT + BELONG -->

        <div class="line line-middle">


          <span class="subject-wrap">

            <span class="subject current">
              I
            </span>

            <span class="subject next"></span>

          </span>


          <span class="belong-wrap">

            <span class="belong-word">
              Belong.
            </span>

          </span>


        </div>


        <!-- BECOME -->

        <div class="line line-bottom">

          <span class="brand static-word">
            Become.
          </span>

        </div>


      </div>


      <!-- =================================
           FINAL AZURE MESSAGE

           Completely separate from logo.
      ================================= -->

      <div
        id="finalMessage"
        class="final-message"
      >
        Disability Belongs.
      </div>


    </div>


    <!-- =================================
         PAUSE / PLAY
    ================================= -->

    <div class="controls">

      <button
        id="pauseButton"
        class="pause-btn"
        type="button"
        aria-pressed="false"
      >
        Pause animation
      </button>

    </div>


    <!-- =================================
         DISTRICT LOGO
    ================================= -->

    <div class="district-logo">

      <img
        src="images/SDCCD_Primary_Vertical_Full_Color_White.png?v=2"
        alt="San Diego Community College District"
      >

    </div>


  </main>


  <script>

    /* =================================
       SUBJECT SEQUENCE

       Official logo remains unchanged:

       Be.
       Belong.
       Become.

       Only the azure subject changes.
    ================================= */

    const subjects = [
      "I",
      "You",
      "We"
    ];


    const currentEl =
      document.querySelector(
        ".subject.current"
      );


    const nextEl =
      document.querySelector(
        ".subject.next"
      );


    const logoStack =
      document.querySelector(
        "#logoStack"
      );


    const finalMessage =
      document.querySelector(
        "#finalMessage"
      );


    const pauseBtn =
      document.querySelector(
        "#pauseButton"
      );


    const reduceMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    let currentIndex = 0;

    let timer = null;

    let paused = false;

    let animating = false;

    let finalState = false;


    /*
      Timing.

      I / You / We each remain visible
      for this amount of time.
    */

    const subjectDuration = 3200;


    /*
      Disability Belongs. remains visible
      slightly longer before looping.
    */

    const finalDuration = 4200;


    /* =================================
       CLEAR TIMER
    ================================= */

    function clearTimer() {

      if (timer !== null) {

        clearTimeout(timer);

        timer = null;
      }
    }


    /* =================================
       SCHEDULE NEXT STEP
    ================================= */

    function scheduleNext(
      callback,
      delay
    ) {

      clearTimer();


      if (
        paused ||
        reduceMotion.matches
      ) {
        return;
      }


      timer =
        setTimeout(
          callback,
          delay
        );
    }


    /* =================================
       SHOW CURRENT SUBJECT
    ================================= */

    function showSubject(index) {

      currentIndex = index;

      finalState = false;


      logoStack.classList.remove(
        "logo-hidden"
      );


      finalMessage.classList.remove(
        "visible"
      );


      currentEl.textContent =
        subjects[index];


      currentEl.className =
        "subject current";


      nextEl.textContent =
        "";


      nextEl.className =
        "subject next";
    }


    /* =================================
       ANIMATE TO NEXT SUBJECT
    ================================= */

    function animateToSubject(nextIndex) {

      if (animating) {
        return;
      }


      animating = true;


      nextEl.textContent =
        subjects[nextIndex];


      nextEl.className =
        "subject next";


      /*
        Force browser layout so
        transition classes animate.
      */

      void nextEl.offsetWidth;


      currentEl.classList.add(
        "exit"
      );


      nextEl.classList.add(
        "enter"
      );


      setTimeout(
        () => {

          currentEl.textContent =
            subjects[nextIndex];


          currentEl.className =
            "subject current";


          nextEl.textContent =
            "";


          nextEl.className =
            "subject next";


          currentIndex =
            nextIndex;


          animating =
            false;


          scheduleNext(
            advanceSequence,
            subjectDuration
          );

        },
        500
      );
    }


    /* =================================
       SHOW FINAL MESSAGE

       Fade away:
       Be.
       Belong.
       Become.
       We

       Then fade in:
       Disability Belongs.
    ================================= */

    function showFinalMessage() {

      finalState = true;

      animating = true;


      /*
        Fade the complete white logo stack
        and azure subject out together.
      */

      logoStack.classList.add(
        "logo-hidden"
      );


      /*
        Allow the logo fade to begin,
        then bring in the separate
        final azure statement.
      */

      setTimeout(
        () => {

          finalMessage.classList.add(
            "visible"
          );


          animating = false;


          scheduleNext(
            restartSequence,
            finalDuration
          );

        },
        450
      );
    }


    /* =================================
       ADVANCE SEQUENCE
    ================================= */

    function advanceSequence() {

      if (
        paused ||
        reduceMotion.matches ||
        animating
      ) {
        return;
      }


      /*
        I -> You
      */

      if (currentIndex === 0) {

        animateToSubject(1);

        return;
      }


      /*
        You -> We
      */

      if (currentIndex === 1) {

        animateToSubject(2);

        return;
      }


      /*
        We -> Disability Belongs.
      */

      if (currentIndex === 2) {

        showFinalMessage();
      }
    }


    /* =================================
       RESTART

       Disability Belongs.
       fades out first.

       Then the original white logo
       returns with I.
    ================================= */

    function restartSequence() {

      if (
        paused ||
        reduceMotion.matches
      ) {
        return;
      }


      finalState = false;

      animating = true;


      finalMessage.classList.remove(
        "visible"
      );


      setTimeout(
        () => {

          currentIndex = 0;


          currentEl.textContent =
            subjects[0];


          currentEl.className =
            "subject current";


          nextEl.textContent =
            "";


          nextEl.className =
            "subject next";


          logoStack.classList.remove(
            "logo-hidden"
          );


          animating = false;


          scheduleNext(
            advanceSequence,
            subjectDuration
          );

        },
        500
      );
    }


    /* =================================
       START LOOP
    ================================= */

    function startLoop() {

      clearTimer();


      if (
        paused ||
        reduceMotion.matches
      ) {
        return;
      }


      /*
        Resume from whichever visual
        state is currently displayed.
      */

      if (finalState) {

        scheduleNext(
          restartSequence,
          finalDuration
        );

      } else {

        scheduleNext(
          advanceSequence,
          subjectDuration
        );
      }
    }


    /* =================================
       STOP LOOP
    ================================= */

    function stopLoop() {

      clearTimer();
    }


    /* =================================
       PAUSE / PLAY
    ================================= */

    pauseBtn.addEventListener(
      "click",
      () => {

        paused =
          !paused;


        pauseBtn.setAttribute(
          "aria-pressed",
          String(paused)
        );


        pauseBtn.textContent =
          paused
            ? "Play animation"
            : "Pause animation";


        if (paused) {

          stopLoop();

        } else {

          startLoop();
        }

      }
    );


    /* =================================
       REDUCED MOTION

       Show only the final static phrase:

       Disability Belongs.
    ================================= */

    function showReducedMotionState() {

      clearTimer();


      finalState = true;

      animating = false;


      logoStack.classList.add(
        "logo-hidden"
      );


      finalMessage.classList.add(
        "visible"
      );


      pauseBtn.hidden =
        true;
    }


    /* =================================
       DEFAULT STATE

             Be.
        I    Belong.
             Become.
    ================================= */

    function showDefaultState() {

      clearTimer();


      currentIndex = 0;

      finalState = false;

      animating = false;


      currentEl.textContent =
        subjects[0];


      currentEl.className =
        "subject current";


      nextEl.textContent =
        "";


      nextEl.className =
        "subject next";


      finalMessage.classList.remove(
        "visible"
      );


      logoStack.classList.remove(
        "logo-hidden"
      );


      pauseBtn.hidden =
        false;
    }


    /* =================================
       RESPOND TO MOTION PREFERENCE
    ================================= */

    function handleReducedMotion(event) {

      stopLoop();


      if (event.matches) {

        showReducedMotionState();

      } else {

        showDefaultState();


        if (!paused) {

          startLoop();
        }
      }
    }


    if (
      typeof
      reduceMotion.addEventListener
      === "function"
    ) {

      reduceMotion.addEventListener(
        "change",
        handleReducedMotion
      );

    } else if (
      typeof
      reduceMotion.addListener
      === "function"
    ) {

      reduceMotion.addListener(
        handleReducedMotion
      );
    }


    /* =================================
       INITIALIZE
    ================================= */

    if (
      reduceMotion.matches
    ) {

      showReducedMotionState();

    } else {

      showDefaultState();

      startLoop();
    }

  </script>

</body>
</html>
