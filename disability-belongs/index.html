<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Disability Belongs</title>

  <style>

    :root {
      --background: #222222;
      --blue: #31A9E0;
      --white: #FFFFFF;

      --main-size: clamp(38px, 5vw, 58px);
      --subject-gap: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;

      background: var(--background);
      color: var(--white);

      font-family: "URW DIN", Arial, sans-serif;

      overflow: hidden;
    }


    /* =================================
       FULL BANNER
    ================================= */

    .banner {
      position: relative;

      width: 100%;
      height: 100vh;
      min-height: 220px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        24px
        24px
        58px;

      background: var(--background);
    }


    /* =================================
       FIXED DISTRICT TAGLINE

             Be.
             Belong.
             Become.

    ================================= */

    .message {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      width: max-content;

      margin: 0 auto;

      gap: 10px;
    }

    .line {
      position: relative;

      display: block;

      margin: 0;
      padding: 0;

      text-align: left;
    }

    .brand,
    .belong-wrap {
      font-size: var(--main-size);
      line-height: 1;

      font-weight: 600;

      letter-spacing: -0.02em;
    }

    .static-word {
      color: var(--white);
    }


    /* =================================
       BELONG / BELONGS
    ================================= */

    .line-middle {
      position: relative;
    }

    .belong-wrap {
      display: inline-flex;
      align-items: baseline;

      color: var(--white);

      white-space: nowrap;
    }

    .belong-word,
    .ending {
      color: var(--white);
    }

    .ending {
      display: inline;
    }


    /* =================================
       ROTATING SUBJECT

       I
       You
       We
       Disability
    ================================= */

    .subject-wrap {
      position: absolute;

      right: calc(100% + var(--subject-gap));
      top: 0;

      width: 12ch;
      height: 1em;

      text-align: right;

      font-size: var(--main-size);
      line-height: 1;
    }

    .subject {
      position: absolute;

      top: 0;
      right: 0;

      font-size: inherit;
      line-height: inherit;

      font-weight: 600;

      letter-spacing: -0.02em;

      color: var(--blue);

      white-space: nowrap;

      opacity: 0;

      transform: translateY(14px);
    }

    .subject.current {
      opacity: 1;

      transform: translateY(0);
    }

    .subject.enter {
      opacity: 1;

      transform: translateY(0);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }

    .subject.exit {
      opacity: 0;

      transform: translateY(-14px);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }


    /* =================================
       PAUSE / PLAY
       Bottom-left
    ================================= */

    .controls {
      position: absolute;

      left: 18px;
      bottom: 14px;

      z-index: 3;
    }

    .pause-btn {
      appearance: none;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 36px;

      padding: 7px 15px;

      border:
        1px solid
        rgba(255, 255, 255, 0.55);

      border-radius: 999px;

      background: transparent;
      color: var(--white);

      font-family:
        "URW DIN",
        Arial,
        sans-serif;

      font-size: 13px;
      font-weight: 600;

      line-height: 1;

      cursor: pointer;
    }

    .pause-btn:hover {
      border-color: var(--blue);
    }

    .pause-btn:focus-visible {
      outline:
        3px solid
        var(--blue);

      outline-offset: 3px;
    }


    /* =================================
       SDCCD LOGO
       Bottom-right
    ================================= */

    .district-logo {
      position: absolute;

      right: 18px;
      bottom: 14px;

      z-index: 2;
    }

   .district-logo img {
  display: block;
  width: 220px;
  max-width: 32vw;
  height: auto;
}


    /* =================================
       SCREEN-READER-ONLY CONTENT
    ================================= */

    .sr-only {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);

      white-space: nowrap;

      border: 0;
    }


    /* =================================
       TABLET / SMALLER WINDOWS
    ================================= */

    @media (max-width: 700px) {

      :root {
        --main-size:
          clamp(28px, 7vw, 40px);

        --subject-gap: 8px;
      }

      .banner {
        padding:
          16px
          12px
          54px;
      }

      .subject-wrap {
        width: 9ch;
      }

      .controls {
        left: 10px;
        bottom: 9px;
      }

      .pause-btn {
        min-height: 32px;

        padding: 6px 11px;

        font-size: 11px;
      }

      .district-logo {
        right: 10px;
        bottom: 9px;
      }

      .district-logo img {
        width: 115px;
        max-width: 31vw;
      }
    }


    /* =================================
       PHONE
    ================================= */

    @media (max-width: 430px) {

      :root {
        --main-size:
          clamp(26px, 7.5vw, 34px);

        --subject-gap: 6px;
      }

      .banner {
        padding:
          14px
          8px
          49px;
      }

      .subject-wrap {
        width: 8.5ch;
      }

      .controls {
        left: 8px;
        bottom: 8px;
      }

      .pause-btn {
        min-height: 30px;

        padding: 5px 9px;

        font-size: 10px;
      }

      .district-logo {
        right: 8px;
        bottom: 8px;
      }

      .district-logo img {
        width: 95px;
        max-width: 29vw;
      }
    }


    /* =================================
       REDUCED MOTION

       Users requesting reduced motion
       receive the static course message:
       Disability Belongs.
    ================================= */

    @media (prefers-reduced-motion: reduce) {

      .subject {
        transition: none !important;
        transform: none !important;
      }

      .controls {
        display: none;
      }
    }

  </style>
</head>


<body>

  <main
    class="banner"
    aria-label="Disability Belongs"
  >


    <!--
      Accessible static equivalent.

      The animated visual is hidden from
      assistive technology so a screen reader
      does not repeatedly announce each change.
    -->

    <p class="sr-only">
      Be. Belong. Become.
      I belong.
      You belong.
      We belong.
      Disability belongs.
    </p>


    <!-- =================================
         ANIMATED VISUAL
    ================================= -->

    <div
      class="message"
      aria-hidden="true"
    >


      <!-- BE -->

      <div class="line line-top">

        <span class="brand static-word">
          Be.
        </span>

      </div>


      <!-- ROTATING SUBJECT + BELONG -->

      <div class="line line-middle">


        <span class="subject-wrap">

          <span class="subject current">
            I
          </span>

          <span class="subject next"></span>

        </span>


        <span class="belong-wrap">

          <span class="belong-word">
            Belong
          </span><span
            id="ending"
            class="ending"
          >.</span>

        </span>


      </div>


      <!-- BECOME -->

      <div class="line line-bottom">

        <span class="brand static-word">
          Become.
        </span>

      </div>


    </div>


    <!-- =================================
         ACCESSIBLE PAUSE / PLAY CONTROL
    ================================= -->

    <div class="controls">

      <button
        id="pauseButton"
        class="pause-btn"
        type="button"
        aria-pressed="false"
      >
        Pause animation
      </button>

    </div>


    <!-- =================================
         DISTRICT LOGO
    ================================= -->

    <div class="district-logo">

      <img
        src="images/sdccd-logo-db.png"
        alt="San Diego Community College District"
      >

    </div>


  </main>


  <script>

    /*
      Animation:

      I Belong.
      You Belong.
      We Belong.
      Disability Belongs.
    */

    const frames = [

      {
        subject: "I",
        ending: "."
      },

      {
        subject: "You",
        ending: "."
      },

      {
        subject: "We",
        ending: "."
      },

      {
        subject: "Disability",
        ending: "s."
      }

    ];


    const currentEl =
      document.querySelector(
        ".subject.current"
      );

    const nextEl =
      document.querySelector(
        ".subject.next"
      );

    const endingEl =
      document.querySelector(
        "#ending"
      );

    const pauseBtn =
      document.querySelector(
        "#pauseButton"
      );


    const reduceMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    let currentIndex = 0;

    let timer = null;

    let paused = false;

    let animating = false;


    /* =================================
       DISPLAY CURRENT FRAME
    ================================= */

    function renderCurrentFrame() {

      const frame =
        frames[currentIndex];


      currentEl.textContent =
        frame.subject;


      endingEl.textContent =
        frame.ending;
    }


    /* =================================
       ANIMATE TO NEXT FRAME
    ================================= */

    function animateTo(nextIndex) {

      if (animating) {
        return;
      }


      animating = true;


      const nextFrame =
        frames[nextIndex];


      nextEl.textContent =
        nextFrame.subject;


      nextEl.className =
        "subject next";


      /*
        Force browser layout before
        applying transition classes.
      */

      void nextEl.offsetWidth;


      currentEl.classList.add(
        "exit"
      );


      nextEl.classList.add(
        "enter"
      );


      /*
        Belong.
        becomes
        Belongs.
        on the Disability frame.
      */

      endingEl.textContent =
        nextFrame.ending;


      setTimeout(() => {


        currentEl.textContent =
          nextFrame.subject;


        currentEl.className =
          "subject current";


        nextEl.textContent =
          "";


        nextEl.className =
          "subject next";


        currentIndex =
          nextIndex;


        animating =
          false;


      }, 500);
    }


    /* =================================
       ADVANCE FRAME
    ================================= */

    function advanceFrame() {

      const nextIndex =
        (currentIndex + 1)
        % frames.length;


      animateTo(
        nextIndex
      );
    }


    /* =================================
       START LOOP
    ================================= */

    function startLoop() {

      stopLoop();


      if (
        paused ||
        reduceMotion.matches
      ) {
        return;
      }


      timer =
        setInterval(
          advanceFrame,
          3200
        );
    }


    /* =================================
       STOP LOOP
    ================================= */

    function stopLoop() {

      if (timer !== null) {

        clearInterval(timer);

        timer = null;
      }
    }


    /* =================================
       PAUSE / PLAY BUTTON
    ================================= */

    pauseBtn.addEventListener(
      "click",
      () => {


        paused =
          !paused;


        pauseBtn.setAttribute(
          "aria-pressed",
          String(paused)
        );


        pauseBtn.textContent =
          paused
            ? "Play animation"
            : "Pause animation";


        if (paused) {

          stopLoop();

        } else {

          startLoop();
        }

      }
    );


    /* =================================
       REDUCED MOTION

       Instead of animating, display
       Disability Belongs.
    ================================= */

    function showReducedMotionState() {

      currentIndex =
        frames.length - 1;


      currentEl.textContent =
        frames[currentIndex].subject;


      currentEl.className =
        "subject current";


      nextEl.textContent =
        "";


      nextEl.className =
        "subject next";


      endingEl.textContent =
        frames[currentIndex].ending;
    }


    function showDefaultState() {

      currentIndex = 0;


      currentEl.textContent =
        frames[0].subject;


      currentEl.className =
        "subject current";


      nextEl.textContent =
        "";


      nextEl.className =
        "subject next";


      endingEl.textContent =
        frames[0].ending;
    }


    function handleReducedMotion(event) {

      stopLoop();


      if (event.matches) {

        showReducedMotionState();

        pauseBtn.hidden =
          true;

      } else {

        showDefaultState();

        pauseBtn.hidden =
          false;


        if (!paused) {

          startLoop();
        }
      }
    }


    if (
      typeof
      reduceMotion.addEventListener
      === "function"
    ) {

      reduceMotion.addEventListener(
        "change",
        handleReducedMotion
      );

    } else if (
      typeof
      reduceMotion.addListener
      === "function"
    ) {

      reduceMotion.addListener(
        handleReducedMotion
      );
    }


    /* =================================
       INITIALIZE
    ================================= */

    if (
      reduceMotion.matches
    ) {

      showReducedMotionState();

      pauseBtn.hidden =
        true;

    } else {

      showDefaultState();

      startLoop();
    }

  </script>

</body>
</html>
