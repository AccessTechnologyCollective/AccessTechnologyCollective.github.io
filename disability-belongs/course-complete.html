
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Course Complete</title>

  <style>
    :root {
      --background: #222222;
      --white: #FFFFFF;
      --text-secondary: #E5E7EB;
      --accent: #A0D4EE;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      background: var(--background);
    }

    body {
      overflow: hidden;

      color: var(--white);

      font-family:
        "URW DIN",
        Arial,
        Helvetica,
        sans-serif;
    }


    .celebration {
      position: relative;

      width: 100%;
      height: 100vh;
      min-height: 150px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: var(--background);
    }


    .message {
      position: relative;

      z-index: 2;

      width: 100%;
      max-width: 700px;

      padding: 18px 24px;

      text-align: center;
    }

    .checkmark {
      width: 54px;
      height: 54px;

      margin: 0 auto 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px solid var(--accent);

      border-radius: 50%;

      color: var(--accent);

      font-size: 30px;
      font-weight: 700;

      line-height: 1;
    }

    .message h1 {
      margin: 0;

      color: var(--white);

      font-size:
        clamp(28px, 5vw, 42px);

      font-weight: 600;

      line-height: 1.2;

      letter-spacing: 0.01em;
    }

    .message p {
      margin: 9px 0 0;

      color: var(--accent);

      font-size:
        clamp(15px, 2vw, 19px);

      font-weight: 600;

      line-height: 1.45;

      letter-spacing: 0.025em;
    }


    #confetti {
      position: absolute;

      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 1;
    }


    body.confetti-only .message {
      display: none;
    }


    .sr-only {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);

      white-space: nowrap;

      border: 0;
    }


    @media (max-width: 500px) {

      .celebration {
        min-height: 130px;
      }

      .message {
        padding:
          14px
          16px;
      }

      .checkmark {
        width: 46px;
        height: 46px;

        margin-bottom: 10px;

        font-size: 25px;
      }
    }


    @media (prefers-reduced-motion: reduce) {

      #confetti {
        display: none;
      }
    }

  </style>
</head>


<body>

  <main
    class="celebration"
    aria-label="Course completion celebration"
  >

    <p class="sr-only">
      Course complete.
    </p>

    <canvas
      id="confetti"
      aria-hidden="true"
    ></canvas>

    <div
      class="message"
      aria-hidden="true"
    >

      <div class="checkmark">
        ✓
      </div>

      <h1>
        Course Complete
      </h1>

      <p id="accentText">
        Nice work.
      </p>

    </div>

  </main>


  <script>

    const params =
      new URLSearchParams(
        window.location.search
      );



    const themes = {

      azure: {
        accent: "#A0D4EE",
        confetti: [
          "#31A9E0", "#6FC5EC", "#A0D4EE",
          "#D5EFFA", "#FFFFFF"
        ]
      },

      red: {
        accent: "#F29AA3",
        confetti: [
          "#BE1E2D", "#D94A58", "#E87681",
          "#F29AA3", "#FFFFFF"
        ]
      },

      darkblue: {
        accent: "#79BCE8",
        confetti: [
          "#0054A4", "#2478BE", "#31A9E0",
          "#79BCE8", "#A0D4EE", "#FFFFFF"
        ]
      },

      teal: {
        accent: "#83D0D4",
        confetti: [
          "#1E9097", "#4DB2B8", "#83D0D4",
          "#A9E2E5", "#FFFFFF"
        ]
      },

      purple: {
        accent: "#B99AD2",
        confetti: [
          "#5F3688", "#7E57A5", "#9B75BC",
          "#B99AD2", "#D4BFE5", "#31A9E0",
          "#FFFFFF"
        ]
      },

      multicolor: {
        accent: "#A0D4EE",
        confetti: [
          "#31A9E0", "#A0D4EE", "#F29AA3",
          "#79BCE8", "#83D0D4", "#B99AD2",
          "#FFFFFF"
        ]
      }

    };
        


    const themeName =
      params.get("theme") || "multicolor";

    const theme =
      themes[themeName] || themes.multicolor;

    document.documentElement
      .style
      .setProperty("--accent", theme.accent);

    const mode = params.get("mode");

    if (mode === "confetti") {
      document.body
        .classList.add("confetti-only");
    }

    const message = params.get("message");

    if (message && mode !== "confetti") {
      document
        .querySelector("#accentText")
        .textContent = message;
    }

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );

    if (!reducedMotion.matches) {

      const canvas =
        document.querySelector("#confetti");

      const ctx =
        canvas.getContext("2d");

      let width;
      let height;

      function resizeCanvas() {

        const dpr =
          window.devicePixelRatio || 1;

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width =
          Math.floor(width * dpr);

        canvas.height =
          Math.floor(height * dpr);

        canvas.style.width =
          width + "px";

        canvas.style.height =
          height + "px";

        ctx.setTransform(
          dpr, 0, 0, dpr, 0, 0
        );
      }

      window.addEventListener(
        "resize", resizeCanvas
      );

      resizeCanvas();




          const pieces = [];

          const pieceCount =
            width < 500 ? 120 : 200;

          function createPiece(startAbove) {
            return {
              x: Math.random() * width,
              y: startAbove
                ? -Math.random() * height
                : -10 - Math.random() * 60,
              width: 6 + Math.random() * 7,
              height: 9 + Math.random() * 12,
              color: theme.confetti[
                Math.floor(
                  Math.random()
                  * theme.confetti.length
                )
              ],
              speed: 2 + Math.random() * 4,
              drift: -1.5 + Math.random() * 3,
              rotation: Math.random() * Math.PI * 2,
              rotationSpeed: -0.1 + Math.random() * 0.2,
              wobblePhase: Math.random() * Math.PI * 2,
              wobbleSpeed: 0.02 + Math.random() * 0.04,
              wobbleAmount: 0.3 + Math.random() * 1.2,
              opacity: 1
            };
          }

          for (let i = 0; i < pieceCount; i++) {
            pieces.push(createPiece(true));
          }

          let startTime = null;

          const duration = 10000;

          const recycleStopTime = duration - 2000;

          let secondWaveAdded = false;

          function resetPiece(piece) {
            const fresh = createPiece(false);
            Object.assign(piece, fresh);
          }

          function draw(timestamp) {

            if (!startTime) {
              startTime = timestamp;
            }

            const elapsed =
              timestamp - startTime;

            if (!secondWaveAdded && elapsed > 1500) {
              secondWaveAdded = true;
              const extraCount = width < 500 ? 40 : 60;
              for (let i = 0; i < extraCount; i++) {
                const p = createPiece(false);
                p.y = -Math.random() * 80;
                p.speed = 3 + Math.random() * 4;
                pieces.push(p);
              }
            }

            ctx.clearRect(
              0, 0, width, height
            );

            let anyVisible = false;

            const fadeStart = duration - 1500;

            pieces.forEach(piece => {

              piece.y += piece.speed;
              piece.wobblePhase += piece.wobbleSpeed;
              piece.x += piece.drift + Math.sin(piece.wobblePhase) * piece.wobbleAmount;
              piece.rotation +=
                piece.rotationSpeed;

              if (elapsed > fadeStart && elapsed < duration) {
                piece.opacity = Math.max(0, 1 - (elapsed - fadeStart) / 1500);
              } else if (elapsed >= duration) {
                piece.opacity = 0;
              }

              if (piece.y > height + 20) {
                if (elapsed < recycleStopTime) {
                  resetPiece(piece);
                } else {
                  piece.y = height + 100;
                  return;
                }
              }

              if (piece.y < height + 50 && piece.opacity > 0) {
                anyVisible = true;
              }

              if (piece.opacity <= 0) return;

              ctx.save();

              ctx.globalAlpha = piece.opacity;

              ctx.translate(
                piece.x, piece.y
              );

              ctx.rotate(piece.rotation);

              ctx.fillStyle = piece.color;

              ctx.fillRect(
                -piece.width / 2,
                -piece.height / 2,
                piece.width,
                piece.height
              );

              ctx.restore();

            });

            if (anyVisible && elapsed < duration + 3000) {

              requestAnimationFrame(draw);

            } else {

              ctx.clearRect(
                0, 0, width, height
              );
            }
          }

          requestAnimationFrame(draw);
        }
        
        


  </script>

</body>

</html>
