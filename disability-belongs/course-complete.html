
<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Celebrate completing Disability Belongs at SDCCD.">
  <meta property="og:title" content="Course Complete — Disability Belongs at SDCCD">
  <meta property="og:description" content="Celebrate completing Disability Belongs at SDCCD.">
  <meta property="og:image" content="https://cdn.simulationtheory.ai/gasset/?asset=img&amp;prompt=teal%20checkmark%20in%20a%20circle%20on%20a%20dark%20background&amp;w=64&amp;h=64&amp;style=professional">
  <meta property="og:type" content="website">
  <link rel="icon" href="https://cdn.simulationtheory.ai/gasset/?asset=img&amp;prompt=teal%20checkmark%20in%20a%20circle%20on%20a%20dark%20background&amp;w=64&amp;h=64&amp;style=professional">
  <title>Course Complete — Disability Belongs at SDCCD</title>
  <script src="/chat/cdn/papaparse.min.js"></script>
  <style>
    .star {
      position: absolute;
      top: -40px;
      left: var(--left);
      color: var(--color);
      font-size: var(--size);
      line-height: 1;
      animation: fall var(--duration) linear var(--delay) infinite;
    }

    @keyframes fall {
      from {
        transform: translate(0, 0) rotate(0deg);
      }

      to {
        transform: translate(var(--drift), 380px) rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .star {
        animation: none;
        top: var(--resting-top);
      }
    }
  </style>
</head>
<body class="m-0 bg-[#222222] font-sans text-white">
  <main class="relative flex h-[300px] w-full items-center justify-center overflow-hidden text-center">
    <div id="stars" class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true"></div>

    <div class="relative z-10 max-w-[calc(100%-32px)]">
      <svg class="mx-auto mb-4 block h-14 w-14" viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="25" fill="none" stroke="#31a9e0" stroke-width="3"></circle>
        <path d="M16 28l8 8 16-18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>

      <h1 class="m-0 text-[clamp(28px,6vw,42px)] font-bold leading-tight">Course Complete</h1>
      <p class="mt-2.5 text-[clamp(16px,3vw,20px)] leading-snug">Disability Belongs at SDCCD</p>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      try {
        const container = document.getElementById("stars");
        if (!container) {
          throw new Error("Stars container was not found.");
        }

        const colors = ["#31a9e0", "#be1e2d", "#0054a4", "#1e9097", "#5F3688"];
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < 75; i++) {
          const star = document.createElement("span");
          const duration = 3.5 + Math.random() * 2.5;

          star.className = "star";
          star.textContent = "★";
          star.style.setProperty("--color", colors[i % colors.length]);
          star.style.setProperty("--left", `${Math.random() * 100}%`);
          star.style.setProperty("--size", `${20 + Math.random() * 12}px`);
          star.style.setProperty("--duration", `${duration}s`);
          star.style.setProperty("--delay", `${-Math.random() * duration}s`);
          star.style.setProperty("--drift", `${Math.random() * 80 - 40}px`);
          star.style.setProperty("--resting-top", `${Math.random() * 280}px`);

          fragment.appendChild(star);
        }

        container.appendChild(fragment);
      } catch (error) {
        console.error("Could not initialize the falling stars:", error);
      }
    });
  </script>
</body>
</html>
