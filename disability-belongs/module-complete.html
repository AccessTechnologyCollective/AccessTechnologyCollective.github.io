<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Module Complete</title>

  <style>
    :root {
      --background: #222222;
      --white: #ffffff;
      --accent: #31A9E0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      background: var(--background);

      font-family:
        "URW DIN",
        Arial,
        sans-serif;
    }

    .celebration {
      position: relative;

      width: 100%;
      height: 100vh;
      min-height: 180px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .message {
      position: relative;
      z-index: 2;

      text-align: center;

      color: var(--white);
    }

    .checkmark {
      width: 54px;
      height: 54px;

      margin: 0 auto 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        3px solid
        var(--accent);

      border-radius: 50%;

      color: var(--accent);

      font-size: 30px;
      font-weight: 700;

      line-height: 1;
    }

    .message h1 {
      margin: 0;

      color: var(--white);

      font-size:
        clamp(28px, 5vw, 42px);

      font-weight: 600;

      letter-spacing: 0.01em;
    }

    .message p {
      margin:
        8px
        0
        0;

      color: var(--accent);

      font-size:
        clamp(15px, 2vw, 19px);

      font-weight: 600;

      letter-spacing: 0.03em;
    }

    #confetti {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 1;
    }

    .sr-only {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);

      white-space: nowrap;

      border: 0;
    }

    @media (max-width: 500px) {
      .checkmark {
        width: 46px;
        height: 46px;

        font-size: 25px;
      }

      .message p {
        margin-top: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #confetti {
        display: none;
      }
    }
  </style>
</head>


<body>

  <main
    class="celebration"
    aria-label="Module complete"
  >

    <p class="sr-only">
      Module complete.
    </p>

    <canvas
      id="confetti"
      aria-hidden="true"
    ></canvas>

    <div
      class="message"
      aria-hidden="true"
    >
      <div class="checkmark">
        ✓
      </div>

      <h1>
        Module Complete
      </h1>

      <p id="accentText">
        Nice work.
      </p>
    </div>

  </main>


  <script>
    const params =
      new URLSearchParams(
        window.location.search
      );


    /* =================================
       THEMES

       Change or add colors here.
    ================================= */

    const themes = {

      azure: {
        accent: "#31A9E0",

        confetti: [
          "#31A9E0",
          "#A0D4EE",
          "#FFFFFF"
        ]
      },

      red: {
        accent: "#BE1E2D",

        confetti: [
          "#BE1E2D",
          "#31A9E0",
          "#FFFFFF"
        ]
      },

      darkblue: {
        accent: "#0054A4",

        confetti: [
          "#0054A4",
          "#31A9E0",
          "#FFFFFF"
        ]
      },

      teal: {
        accent: "#1E9097",

        confetti: [
          "#1E9097",
          "#31A9E0",
          "#FFFFFF"
        ]
      },

      purple: {
        accent: "#5F3688",

        confetti: [
          "#5F3688",
          "#31A9E0",
          "#FFFFFF"
        ]
      },

      multicolor: {
        accent: "#31A9E0",

        confetti: [
          "#31A9E0",
          "#A0D4EE",
          "#BE1E2D",
          "#0054A4",
          "#1E9097",
          "#5F3688",
          "#FFFFFF"
        ]
      }

    };


    /* =================================
       SELECT THEME FROM URL

       Example:
       ?theme=red
    ================================= */

    const themeName =
      params.get("theme")
      || "azure";


    const theme =
      themes[themeName]
      || themes.azure;


    document.documentElement
      .style
      .setProperty(
        "--accent",
        theme.accent
      );


    /* =================================
       OPTIONAL MESSAGE PARAMETER

       Example:
       ?message=Great%20work!
    ================================= */

    const message =
      params.get("message");


    if (message) {
      document
        .querySelector("#accentText")
        .textContent =
        message;
    }


    /* =================================
       REDUCED MOTION

       Users who prefer reduced motion
       see the completed state without
       confetti.
    ================================= */

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    if (!reducedMotion.matches) {

      const canvas =
        document.querySelector(
          "#confetti"
        );


      const ctx =
        canvas.getContext("2d");


      let width;
      let height;


      function resizeCanvas() {

        width =
          canvas.width =
          window.innerWidth;


        height =
          canvas.height =
          window.innerHeight;
      }


      window.addEventListener(
        "resize",
        resizeCanvas
      );


      resizeCanvas();


      /* =================================
         CONFETTI PIECES
      ================================= */

      const pieces = [];


      const pieceCount = 90;


      for (
        let i = 0;
        i < pieceCount;
        i++
      ) {

        pieces.push({

          x:
            Math.random()
            * width,

          y:
            -Math.random()
            * height,

          width:
            5
            + Math.random()
            * 5,

          height:
            8
            + Math.random()
            * 8,

          color:
            theme.confetti[
              Math.floor(
                Math.random()
                * theme.confetti.length
              )
            ],

          speed:
            2
            + Math.random()
            * 3,

          drift:
            -1
            + Math.random()
            * 2,

          rotation:
            Math.random()
            * Math.PI,

          rotationSpeed:
            -0.08
            + Math.random()
            * 0.16

        });
      }


      let startTime = null;


      /*
        Confetti runs briefly,
        then stops completely.
      */

      const duration =
        3200;


      function draw(timestamp) {

        if (!startTime) {
          startTime = timestamp;
        }


        const elapsed =
          timestamp - startTime;


        ctx.clearRect(
          0,
          0,
          width,
          height
        );


        pieces.forEach(
          piece => {

            piece.y +=
              piece.speed;


            piece.x +=
              piece.drift;


            piece.rotation +=
              piece.rotationSpeed;


            ctx.save();


            ctx.translate(
              piece.x,
              piece.y
            );


            ctx.rotate(
              piece.rotation
            );


            ctx.fillStyle =
              piece.color;


            ctx.fillRect(
              -piece.width / 2,
              -piece.height / 2,
              piece.width,
              piece.height
            );


            ctx.restore();
          }
        );


        if (elapsed < duration) {

          requestAnimationFrame(
            draw
          );

        } else {

          ctx.clearRect(
            0,
            0,
            width,
            height
          );
        }
      }


      requestAnimationFrame(
        draw
      );
    }
  </script>

</body>
</html>
