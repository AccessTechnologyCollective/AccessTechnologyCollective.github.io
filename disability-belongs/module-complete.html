<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Module Complete</title>

  <style>
    :root {
      --background: #222222;
      --white: #FFFFFF;
      --text-secondary: #E5E7EB;

      /* Default theme */
      --accent: #A0D4EE;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      background: var(--background);
    }

    body {
      overflow: hidden;

      color: var(--white);

      font-family:
        "URW DIN",
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =========================================
       CELEBRATION AREA
    ========================================= */

    .celebration {
      position: relative;

      width: 100%;
      height: 100vh;
      min-height: 150px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: var(--background);
    }


    /* =========================================
       MESSAGE
    ========================================= */

    .message {
      position: relative;

      z-index: 2;

      width: 100%;
      max-width: 700px;

      padding: 18px 24px;

      text-align: center;
    }

    .checkmark {
      width: 54px;
      height: 54px;

      margin: 0 auto 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px solid var(--accent);

      border-radius: 50%;

      color: var(--accent);

      font-size: 30px;
      font-weight: 700;

      line-height: 1;
    }

    .message h1 {
      margin: 0;

      color: var(--white);

      font-size:
        clamp(28px, 5vw, 42px);

      font-weight: 600;

      line-height: 1.2;

      letter-spacing: 0.01em;
    }

    .message p {
      margin: 9px 0 0;

      color: var(--accent);

      font-size:
        clamp(15px, 2vw, 19px);

      font-weight: 600;

      line-height: 1.45;

      letter-spacing: 0.025em;
    }


    /* =========================================
       CONFETTI CANVAS
    ========================================= */

    #confetti {
      position: absolute;

      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 1;
    }


    /* =========================================
       CONFETTI-ONLY MODE
    ========================================= */

    body.confetti-only .message {
      display: none;
    }


    /* =========================================
       SCREEN-READER-ONLY CONTENT
    ========================================= */

    .sr-only {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);

      white-space: nowrap;

      border: 0;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 500px) {

      .celebration {
        min-height: 130px;
      }

      .message {
        padding:
          14px
          16px;
      }

      .checkmark {
        width: 46px;
        height: 46px;

        margin-bottom: 10px;

        font-size: 25px;
      }
    }


    /* =========================================
       REDUCED MOTION
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      #confetti {
        display: none;
      }
    }

  </style>
</head>


<body>

  <main
    class="celebration"
    aria-label="Module completion celebration"
  >

    <p class="sr-only">
      Module complete.
    </p>

    <canvas
      id="confetti"
      aria-hidden="true"
    ></canvas>

    <div
      class="message"
      aria-hidden="true"
    >

      <div class="checkmark">
        ✓
      </div>

      <h1>
        Module Complete
      </h1>

      <p id="accentText">
        Nice work.
      </p>

    </div>

  </main>


  <script>

    const params =
      new URLSearchParams(
        window.location.search
      );


    const themes = {

      azure: {
        accent: "#A0D4EE",
        confetti: [
          "#31A9E0", "#6FC5EC", "#A0D4EE",
          "#D5EFFA", "#FFFFFF"
        ]
      },

      red: {
        accent: "#F29AA3",
        confetti: [
          "#BE1E2D", "#D94A58", "#E87681",
          "#F29AA3", "#FFFFFF"
        ]
      },

      darkblue: {
        accent: "#79BCE8",
        confetti: [
          "#0054A4", "#2478BE", "#31A9E0",
          "#79BCE8", "#A0D4EE", "#FFFFFF"
        ]
      },

      teal: {
        accent: "#83D0D4",
        confetti: [
          "#1E9097", "#4DB2B8", "#83D0D4",
          "#A9E2E5", "#FFFFFF"
        ]
      },

      purple: {
        accent: "#B99AD2",
        confetti: [
          "#5F3688", "#7E57A5", "#9B75BC",
          "#B99AD2", "#D4BFE5", "#31A9E0",
          "#FFFFFF"
        ]
      },

      multicolor: {
        accent: "#A0D4EE",
        confetti: [
          "#31A9E0", "#A0D4EE", "#F29AA3",
          "#79BCE8", "#83D0D4", "#B99AD2",
          "#FFFFFF"
        ]
      }

    };
        

    const themeName =
      params.get("theme") || "azure";

    const theme =
      themes[themeName] || themes.azure;

    document.documentElement
      .style
      .setProperty("--accent", theme.accent);

    const mode = params.get("mode");

    if (mode === "confetti") {
      document.body
        .classList.add("confetti-only");
    }

    const message = params.get("message");

    if (message && mode !== "confetti") {
      document
        .querySelector("#accentText")
        .textContent = message;
    }

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );

    if (!reducedMotion.matches) {

      const canvas =
        document.querySelector("#confetti");

      const ctx =
        canvas.getContext("2d");

      let width;
      let height;

      function resizeCanvas() {

        const dpr =
          window.devicePixelRatio || 1;

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width =
          Math.floor(width * dpr);

        canvas.height =
          Math.floor(height * dpr);

        canvas.style.width =
          width + "px";

        canvas.style.height =
          height + "px";

        ctx.setTransform(
          dpr, 0, 0, dpr, 0, 0
        );
      }

      window.addEventListener(
        "resize", resizeCanvas
      );

      resizeCanvas();

      /* =====================================
         CREATE CONFETTI
      ===================================== */


        const pieces = [];

        const pieceCount =
          width < 500 ? 70 : 100;

        for (
          let i = 0;
          i < pieceCount;
          i++
        ) {

          pieces.push({

            x:
              Math.random() * width,

            y:
              -Math.random() * height,

            width:
              5 + Math.random() * 5,

            height:
              8 + Math.random() * 9,

            color:
              theme.confetti[
                Math.floor(
                  Math.random()
                  * theme.confetti.length
                )
              ],

            speed:
              2 + Math.random() * 3,

            drift:
              -1 + Math.random() * 2,

            rotation:
              Math.random() * Math.PI,

            rotationSpeed:
              -0.08 + Math.random() * 0.16

          });
        }


          let startTime = null;

          const duration = 10000;

          const recycleStopTime = duration - 2000;

          function resetPiece(piece) {
            piece.x = Math.random() * width;
            piece.y = -10 - Math.random() * 40;
            piece.speed = 2 + Math.random() * 3;
            piece.drift = -1 + Math.random() * 2;
            piece.rotation = Math.random() * Math.PI;
            piece.rotationSpeed = -0.08 + Math.random() * 0.16;
            piece.color = theme.confetti[
              Math.floor(
                Math.random()
                * theme.confetti.length
              )
            ];
          }

          function draw(timestamp) {

            if (!startTime) {
              startTime = timestamp;
            }

            const elapsed =
              timestamp - startTime;

            ctx.clearRect(
              0, 0, width, height
            );

            let anyVisible = false;

            pieces.forEach(piece => {

              piece.y += piece.speed;
              piece.x += piece.drift;
              piece.rotation +=
                piece.rotationSpeed;

              if (piece.y > height + 20) {
                if (elapsed < recycleStopTime) {
                  resetPiece(piece);
                } else {
                  piece.y = height + 100;
                  return;
                }
              }

              if (piece.y < height + 50) {
                anyVisible = true;
              }

              ctx.save();

              ctx.translate(
                piece.x, piece.y
              );

              ctx.rotate(piece.rotation);

              ctx.fillStyle = piece.color;

              ctx.fillRect(
                -piece.width / 2,
                -piece.height / 2,
                piece.width,
                piece.height
              );

              ctx.restore();

            });

            if (anyVisible && elapsed < duration + 5000) {

              requestAnimationFrame(draw);

            } else {

              ctx.clearRect(
                0, 0, width, height
              );
            }
          }

          requestAnimationFrame(draw);
        }
        
        

  </script>

</body>

</html>
