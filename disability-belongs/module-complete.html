
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Course Complete | Disability Belongs at SDCCD</title>

  <style>
    :root {
      --background: #222222;
      --text: #ffffff;
      --azure: #31A9E0;
      --light-azure: #6FC5EC;
      --pale-azure: #A0D4EE;
      --red: #BE1E2D;
      --light-red: #E87681;
      --dark-blue: #0054A4;
      --blue: #2478BE;
      --teal: #1E9097;
      --light-teal: #83D0D4;
      --purple: #5F3688;
      --light-purple: #B99AD2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .celebration-page {
      position: relative;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 90px;
      isolation: isolate;
    }

    .celebration-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .completion-icon {
      display: flex;
      width: 100px;
      height: 100px;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      border: 4px solid #31A9E0;
      border-radius: 50%;
      color: #ffffff;
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      box-shadow:
        0 0 0 8px rgba(49, 169, 224, 0.12),
        0 0 28px rgba(49, 169, 224, 0.25);
    }

    h1 {
      margin: 0 0 18px;
      color: #ffffff;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 0;
      color: #6FC5EC;
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      font-weight: 700;
      line-height: 1.4;
    }

    .message {
      max-width: 580px;
      margin: 24px auto 0;
      color: #f2f2f2;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .stars {
      position: fixed;
      z-index: 1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      top: -60px;
      left: var(--left);
      display: block;
      color: var(--color);
      font-family: Arial, Helvetica, sans-serif;
      font-size: var(--size);
      font-weight: 900;
      line-height: 1;
      opacity: 0;
      transform: rotate(var(--rotation));
      text-shadow:
        0 0 1px #ffffff,
        0 0 4px currentColor,
        0 0 10px currentColor;
      -webkit-text-stroke: 0.25px currentColor;
      will-change: transform, opacity;
    }

    .stars.celebrating .star {
      animation:
        star-fall var(--duration) linear var(--delay) 1 both;
    }

    @keyframes star-fall {
      0% {
        transform: translate3d(0, -10px, 0)
                   rotate(var(--rotation))
                   scale(0.65);
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      20% {
        transform: translate3d(
          calc(var(--drift) * 0.15),
          15vh,
          0
        ) rotate(calc(var(--rotation) + 75deg)) scale(1);
        opacity: 1;
      }

      55% {
        transform: translate3d(
          calc(var(--drift) * 0.6),
          55vh,
          0
        ) rotate(calc(var(--rotation) + 220deg)) scale(0.95);
        opacity: 1;
      }

      85% {
        opacity: 0.9;
      }

      100% {
        transform: translate3d(
          var(--drift),
          115vh,
          0
        ) rotate(calc(var(--rotation) + 360deg)) scale(0.8);
        opacity: 0;
      }
    }

    .celebrate-button {
      position: fixed;
      z-index: 5;
      bottom: 22px;
      left: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 12px 20px;
      border: 2px solid #6FC5EC;
      border-radius: 8px;
      background: #222222;
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
      transition:
        background-color 160ms ease,
        color 160ms ease,
        box-shadow 160ms ease;
    }

    .celebrate-button.visible {
      display: inline-flex;
    }

    .celebrate-button:hover {
      background: #31A9E0;
      color: #111111;
      box-shadow: 0 0 16px rgba(49, 169, 224, 0.35);
    }

    .celebrate-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      .celebration-page {
        padding: 36px 20px 100px;
      }

      .completion-icon {
        width: 82px;
        height: 82px;
        margin-bottom: 24px;
        font-size: 46px;
      }

      .message {
        margin-top: 20px;
      }

      .celebrate-button {
        bottom: 16px;
        left: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .celebration-content {
        animation: none;
      }

      .stars.celebrating .star {
        animation: none;
        display: none;
      }

      .celebrate-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="celebration-page">
    <div
      class="stars"
      id="stars"
      aria-hidden="true"
    ></div>

    <section
      class="celebration-content"
      aria-labelledby="completion-heading"
    >
      <div class="completion-icon" aria-hidden="true">
        ✓
      </div>

      <h1 id="completion-heading">Course Complete!</h1>

      <p class="subtitle">
        Disability Belongs at SDCCD
      </p>

      <p class="message">
        Thank you for being part of creating a more accessible,
        inclusive, and welcoming community. Every step toward
        accessibility helps everyone belong.
      </p>
    </section>

    <button
      class="celebrate-button"
      id="celebrate-again"
      type="button"
    >
      <span aria-hidden="true">★</span>
      Celebrate Again!
    </button>
  </main>

  <script>
    (() => {
      const starsContainer = document.getElementById("stars");
      const celebrateButton = document.getElementById("celebrate-again");
      const celebrationDuration = 8000;

      const colors = [
        "#31A9E0",
        "#6FC5EC",
        "#A0D4EE",
        "#D5EFFA",
        "#FFFFFF",
        "#BE1E2D",
        "#D94A58",
        "#E87681",
        "#F29AA3",
        "#0054A4",
        "#2478BE",
        "#79BCE8",
        "#1E9097",
        "#4DB2B8",
        "#83D0D4",
        "#5F3688",
        "#7E57A5",
        "#9B75BC",
        "#B99AD2"
      ];

      let celebrationTimer;

      function createStar() {
        const star = document.createElement("span");

        star.className = "star";
        star.textContent = Math.random() > 0.22 ? "★" : "✦";

        const size = 20 + Math.random() * 24;
        const left = Math.random() * 100;
        const drift = (Math.random() - 0.5) * 180;
        const duration = 4.5 + Math.random() * 3.5;
        const delay = Math.random() * 2.5;
        const rotation = Math.random() * 90 - 45;
        const color = colors[Math.floor(Math.random() * colors.length)];

        star.style.setProperty("--size", `${size}px`);
        star.style.setProperty("--left", `${left}%`);
        star.style.setProperty("--drift", `${drift}px`);
        star.style.setProperty("--duration", `${duration}s`);
        star.style.setProperty("--delay", `${delay}s`);
        star.style.setProperty("--rotation", `${rotation}deg`);
        star.style.setProperty("--color", color);

        return star;
      }

      function startCelebration() {
        window.clearTimeout(celebrationTimer);

        starsContainer.classList.remove("celebrating");
        starsContainer.replaceChildren();

        celebrateButton.classList.remove("visible");

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        if (reducedMotion) {
          celebrateButton.classList.add("visible");
          return;
        }

        const isMobile = window.matchMedia("(max-width: 600px)").matches;
        const starCount = isMobile ? 70 : 120;
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < starCount; i++) {
          fragment.appendChild(createStar());
        }

        starsContainer.appendChild(fragment);

        // Restart the CSS animations.
        void starsContainer.offsetWidth;
        starsContainer.classList.add("celebrating");

        celebrationTimer = window.setTimeout(() => {
          starsContainer.classList.remove("celebrating");
          starsContainer.replaceChildren();
          celebrateButton.classList.add("visible");
        }, celebrationDuration);
      }

      celebrateButton.addEventListener("click", startCelebration);

      startCelebration();
    })();
  </script>
</body>
</html>
