<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Disability Belongs</title>

  <style>

    :root {
      --background: #222222;
      --blue: #31A9E0;
      --white: #FFFFFF;

      /* Same size for Be / Belong / Become */
      --main-size: clamp(38px, 5vw, 58px);

      /* Space between rotating word and Belong */
      --subject-gap: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--background);
      color: var(--white);

      font-family: "URW DIN", Arial, sans-serif;

      overflow: hidden;
    }

    /* ---------------------------------
       FULL BANNER
    ---------------------------------- */

    .banner {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 28px 24px 18px;

      text-align: center;
    }

    /* ---------------------------------
       FIXED BRAND SPINE

             Be.
             Belong.
             Become.

    ---------------------------------- */

    .message {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      width: max-content;
      margin: 0 auto;

      gap: 10px;
    }

    .line {
      position: relative;

      display: block;

      margin: 0;
      padding: 0;

      text-align: left;
    }

    /*
      Be, Belong and Become all use
      the exact same font size.
    */

    .brand,
    .belong-wrap {
      font-size: var(--main-size);
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .static-word {
      color: var(--white);
    }

    /* ---------------------------------
       BELONG
    ---------------------------------- */

    .line-middle {
      position: relative;
    }

    .belong-wrap {
      display: inline-flex;
      align-items: baseline;

      color: var(--blue);

      white-space: nowrap;
    }

    .blue,
    .ending {
      color: var(--blue);
    }

    .ending {
      display: inline;
    }

    /* ---------------------------------
       ROTATING SUBJECT

       Positioned independently so
       I / You / We / Disability never
       move the Be-Belong-Become spine.
    ---------------------------------- */

    .subject-wrap {
      position: absolute;

      right: calc(100% + var(--subject-gap));
      top: 0;

      width: 12ch;
      height: 1em;

      text-align: right;

      font-size: var(--main-size);
      line-height: 1;
    }

    .subject {
      position: absolute;

      top: 0;
      right: 0;

      font-size: inherit;
      line-height: inherit;
      font-weight: 600;
      letter-spacing: -0.02em;

      color: var(--white);

      white-space: nowrap;

      opacity: 0;
      transform: translateY(14px);
    }

    .subject.current {
      opacity: 1;
      transform: translateY(0);
    }

    .subject.enter {
      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }

    .subject.exit {
      opacity: 0;
      transform: translateY(-14px);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    /* ---------------------------------
       PAUSE / PLAY
    ---------------------------------- */

    .controls {
      margin-top: 26px;
      text-align: center;
    }

    .pause-btn {
      appearance: none;

      padding: 8px 18px;

      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;

      background: transparent;
      color: var(--white);

      font-family: "URW DIN", Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .pause-btn:hover {
      border-color: var(--blue);
    }

    .pause-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    /* ---------------------------------
       SCREEN READER TEXT
    ---------------------------------- */

    .sr-only {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);

      white-space: nowrap;

      border: 0;
    }

    /* ---------------------------------
       RESPONSIVE
    ---------------------------------- */

    @media (max-width: 700px) {

  :root {
    --main-size: clamp(28px, 7vw, 40px);
    --subject-gap: 8px;
  }

  .subject-wrap {
    width: 9ch;
  }

  .banner {
    padding: 18px 12px 12px;
  }

  .controls {
    margin-top: 16px;
  }
}

@media (max-width: 430px) {

  :root {
    --main-size: clamp(26px, 7.5vw, 34px);
    --subject-gap: 6px;
  }

  .subject-wrap {
    width: 8.5ch;
  }

  .banner {
    padding-left: 8px;
    padding-right: 8px;
  }
}
    /* ---------------------------------
       REDUCED MOTION
    ---------------------------------- */

    @media (prefers-reduced-motion: reduce) {

      .subject {
        transition: none !important;
        transform: none !important;
      }

      .controls {
        display: none;
      }
    }

  </style>
</head>


<body>

  <main class="banner">

    <!--
      Full static equivalent for screen readers.
      The animated visual below is hidden from
      assistive technology to avoid repeatedly
      announcing changing text.
    -->

    <p class="sr-only">
      Be. Belong. Become. I belong. You belong. We belong. Disability belongs.
    </p>


    <div class="message" aria-hidden="true">

      <!-- BE -->
      <div class="line line-top">
        <span class="brand static-word">Be.</span>
      </div>


      <!-- ROTATING SUBJECT + BELONG -->
      <div class="line line-middle">

        <span class="subject-wrap">
          <span class="subject current">I</span>
          <span class="subject next"></span>
        </span>

        <span class="belong-wrap">
          <span class="blue">Belong</span><span
            id="ending"
            class="ending"
          >.</span>
        </span>

      </div>


      <!-- BECOME -->
      <div class="line line-bottom">
        <span class="brand static-word">Become.</span>
      </div>

    </div>


    <div class="controls">

      <button
        class="pause-btn"
        type="button"
        aria-pressed="false"
      >
        Pause animation
      </button>

    </div>

  </main>


  <script>

    /*
      Rotating messages

      I Belong.
      You Belong.
      We Belong.
      Disability Belongs.
    */

    const frames = [
      {
        subject: "I",
        ending: "."
      },
      {
        subject: "You",
        ending: "."
      },
      {
        subject: "We",
        ending: "."
      },
      {
        subject: "Disability",
        ending: "s."
      }
    ];


    const currentEl =
      document.querySelector(".subject.current");

    const nextEl =
      document.querySelector(".subject.next");

    const endingEl =
      document.querySelector("#ending");

    const pauseBtn =
      document.querySelector(".pause-btn");

    const reduceMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    let currentIndex = 0;
    let timer = null;
    let paused = false;
    let animating = false;


    function renderCurrentFrame() {

      const frame = frames[currentIndex];

      currentEl.textContent =
        frame.subject;

      endingEl.textContent =
        frame.ending;
    }


    function animateTo(nextIndex) {

      if (animating) return;

      animating = true;

      const nextFrame =
        frames[nextIndex];


      nextEl.textContent =
        nextFrame.subject;

      nextEl.className =
        "subject next";


      /*
        Forces the browser to recognize
        the initial animation position.
      */

      void nextEl.offsetWidth;


      currentEl.classList.add("exit");

      nextEl.classList.add("enter");


      /*
        Changes:

        Belong.
        to
        Belongs.

        on the Disability frame.
      */

      endingEl.textContent =
        nextFrame.ending;


      setTimeout(() => {

        currentEl.textContent =
          nextFrame.subject;

        currentEl.className =
          "subject current";


        nextEl.textContent = "";

        nextEl.className =
          "subject next";


        currentIndex =
          nextIndex;

        animating =
          false;

      }, 500);
    }


    function advanceFrame() {

      const nextIndex =
        (currentIndex + 1) % frames.length;

      animateTo(nextIndex);
    }


    function startLoop() {

      stopLoop();

      if (
        paused ||
        reduceMotion.matches
      ) {
        return;
      }


      /*
        Each message remains visible
        for roughly 3.2 seconds.
      */

      timer =
        setInterval(
          advanceFrame,
          3200
        );
    }


    function stopLoop() {

      if (timer !== null) {

        clearInterval(timer);

        timer = null;
      }
    }


    pauseBtn.addEventListener(
      "click",
      () => {

        paused = !paused;


        pauseBtn.setAttribute(
          "aria-pressed",
          String(paused)
        );


        pauseBtn.textContent =
          paused
            ? "Play animation"
            : "Pause animation";


        if (paused) {

          stopLoop();

        } else {

          startLoop();

        }
      }
    );


    function handleReducedMotion(event) {

      if (event.matches) {

        stopLoop();

        pauseBtn.hidden = true;

      } else {

        pauseBtn.hidden = false;


        if (!paused) {

          startLoop();

        }
      }
    }


    if (
      typeof reduceMotion.addEventListener
      === "function"
    ) {

      reduceMotion.addEventListener(
        "change",
        handleReducedMotion
      );

    } else if (
      typeof reduceMotion.addListener
      === "function"
    ) {

      reduceMotion.addListener(
        handleReducedMotion
      );
    }


    renderCurrentFrame();


    /*
      Someone who has Reduced Motion
      enabled receives a static version.
    */

    if (reduceMotion.matches) {

      pauseBtn.hidden = true;

    } else {

      startLoop();
    }

  </script>

</body>
</html>
